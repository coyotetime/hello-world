<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORDLY</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:           #060A12;
  --surface:      #101723;
  --border-empty: #1E2535;
  --border-filled:#3A4558;
  --text:         #FFFFFF;
  --text-2:       #B8C0D0;
  --green:        #65C466;
  --yellow:       #D9B43B;
  --gray:         #2D3545;
  --key-bg:       #1A2233;
  --tile-size:    62px;
  --tile-gap:     8px;
  --radius-tile:  12px;
  --radius-key:   10px;
}

html, body { height: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

/* ── Header ── */
header {
  width: 100%;
  max-width: 500px;
  height: 72px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 20px;
  border-bottom: 1px solid var(--border-empty);
}

.header-side {
  display: flex;
  align-items: center;
  gap: 18px;
  width: 80px;
}

.header-side.right { justify-content: flex-end; }

.icon-btn {
  background: none;
  border: none;
  color: var(--text-2);
  cursor: pointer;
  padding: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: color 0.15s, background 0.15s;
}
.icon-btn:hover { color: var(--text); background: var(--surface); }

header h1 {
  font-size: 1.35rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--text);
}

/* ── Toast ── */
#toast {
  position: fixed;
  top: 88px;
  left: 50%;
  transform: translateX(-50%) translateY(-6px);
  background: var(--text);
  color: var(--bg);
  padding: 10px 22px;
  border-radius: 100px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.15s, transform 0.15s;
  z-index: 200;
  white-space: nowrap;
}
#toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

/* ── Main area ── */
#game-view {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 100%;
  max-width: 500px;
  overflow: hidden;
  min-height: 0;
}

/* ── Grid ── */
#grid-container {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 20px 8px;
  min-height: 0;
}

#grid {
  display: grid;
  grid-template-rows: repeat(6, var(--tile-size));
  grid-template-columns: repeat(5, var(--tile-size));
  gap: var(--tile-gap);
}

/* ── Tile ── */
.tile {
  width: var(--tile-size);
  height: var(--tile-size);
  perspective: 400px;
  cursor: default;
}

.tile-inner {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.35s cubic-bezier(0.45, 0.05, 0.55, 0.95);
}

.tile.flipped .tile-inner {
  transform: rotateY(180deg);
}

.tile-front,
.tile-back {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: 0.05em;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  border-radius: var(--radius-tile);
  border: 1.5px solid var(--border-empty);
}

.tile-front {
  background: var(--bg);
  color: var(--text);
}

.tile-back {
  background: var(--gray);
  color: var(--text);
  border-color: transparent;
  transform: rotateY(180deg);
}

.tile-back.green  { background: var(--green); }
.tile-back.yellow { background: var(--yellow); }
.tile-back.gray   { background: var(--gray); }

/* letter pop on entry */
.tile.pop .tile-front {
  animation: tilePop 0.15s ease-out;
}

@keyframes tilePop {
  0%   { transform: scale(0.95); }
  60%  { transform: scale(1.04); border-color: var(--border-filled); }
  100% { transform: scale(1.0); }
}

.tile.filled .tile-front {
  border-color: var(--border-filled);
  background: var(--surface);
}

/* shake */
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  15%  { transform: translateX(-7px); }
  30%  { transform: translateX(7px); }
  45%  { transform: translateX(-5px); }
  60%  { transform: translateX(5px); }
  75%  { transform: translateX(-3px); }
  90%  { transform: translateX(3px); }
}

/* win wave — translates on Y, Apple-style */
.tile.wave .tile-inner {
  animation: tileWave 0.5s ease-in-out forwards;
}

@keyframes tileWave {
  0%   { transform: rotateY(180deg) translateY(0); }
  25%  { transform: rotateY(180deg) translateY(-12px); }
  50%  { transform: rotateY(180deg) translateY(0px); }
  75%  { transform: rotateY(180deg) translateY(-5px); }
  100% { transform: rotateY(180deg) translateY(0); }
}

/* ── Keyboard ── */
#keyboard {
  width: 100%;
  max-width: 500px;
  padding: 0 6px 12px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.kb-row {
  display: flex;
  justify-content: center;
  gap: 5px;
}

.key {
  height: 52px;
  min-width: 32px;
  padding: 0 4px;
  background: var(--key-bg);
  border: none;
  border-radius: var(--radius-key);
  color: var(--text);
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.04em;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.18s, color 0.18s, transform 0.08s;
  flex: 1;
  max-width: 40px;
}

.key.wide { max-width: 60px; font-size: 0.66rem; letter-spacing: 0; }
.key:active { transform: scale(0.91); }

.key.green  { background: var(--green);  color: #fff; }
.key.yellow { background: var(--yellow); color: #fff; }
.key.gray   { background: var(--gray);   color: var(--text-2); }

/* ── Victory Card ── */
#victory-card {
  position: absolute;
  bottom: calc(var(--kb-height, 160px) + 16px);
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--surface);
  border: 1px solid var(--border-filled);
  border-radius: 18px;
  padding: 20px 28px;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 6px;
  min-width: 280px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 60;
}
#victory-card.show {
  opacity: 1;
  pointer-events: all;
  transform: translateX(-50%) translateY(0);
}

.vc-top {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
}

.vc-check {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  background: var(--green);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.vc-check svg { display: block; }

.vc-title {
  font-size: 1rem;
  font-weight: 700;
  color: var(--text);
  flex: 1;
}

.vc-share {
  background: var(--green);
  border: none;
  border-radius: 10px;
  color: #fff;
  font-family: inherit;
  font-size: 0.75rem;
  font-weight: 700;
  letter-spacing: 0.04em;
  padding: 8px 18px;
  cursor: pointer;
  transition: background 0.15s, transform 0.08s;
  flex-shrink: 0;
}
.vc-share:hover  { background: #79d67a; }
.vc-share:active { transform: scale(0.94); }

.vc-word-line {
  font-size: 0.82rem;
  color: var(--text-2);
  font-weight: 500;
}
.vc-word-line strong {
  color: var(--green);
  font-weight: 700;
  letter-spacing: 0.04em;
}

.vc-divider {
  width: 100%;
  height: 1px;
  background: var(--border-empty);
  margin: 4px 0;
}

.vc-actions {
  display: flex;
  gap: 10px;
  width: 100%;
}

.vc-btn-secondary {
  flex: 1;
  background: var(--border-empty);
  border: none;
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.75rem;
  font-weight: 600;
  padding: 10px 0;
  cursor: pointer;
  transition: background 0.15s, transform 0.08s;
  text-align: center;
}
.vc-btn-secondary:hover  { background: var(--border-filled); }
.vc-btn-secondary:active { transform: scale(0.94); }

/* ── Loss Card ── */
#loss-card {
  position: absolute;
  bottom: calc(var(--kb-height, 160px) + 16px);
  left: 50%;
  transform: translateX(-50%) translateY(12px);
  background: var(--surface);
  border: 1px solid var(--border-empty);
  border-radius: 18px;
  padding: 20px 28px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  min-width: 280px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  z-index: 60;
}
#loss-card.show {
  opacity: 1;
  pointer-events: all;
  transform: translateX(-50%) translateY(0);
}

.lc-label {
  font-size: 0.7rem;
  letter-spacing: 0.14em;
  color: var(--text-2);
  text-transform: uppercase;
  font-weight: 600;
}
.lc-word {
  font-size: 1.8rem;
  font-weight: 700;
  letter-spacing: 0.12em;
  color: var(--text);
  line-height: 1;
}
.lc-msg {
  font-size: 0.82rem;
  color: var(--text-2);
}
.lc-btn {
  margin-top: 4px;
  background: var(--surface);
  border: 1px solid var(--border-filled);
  border-radius: 10px;
  color: var(--text);
  font-family: inherit;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 11px 0;
  cursor: pointer;
  transition: background 0.15s, transform 0.08s;
  text-align: center;
  letter-spacing: 0.04em;
}
.lc-btn:hover  { background: var(--border-empty); }
.lc-btn:active { transform: scale(0.96); }

/* ── Stats overlay ── */
#stats-view {
  display: none;
  flex-direction: column;
  width: 100%;
  max-width: 500px;
  flex: 1;
  padding: 24px 24px 16px;
  overflow-y: auto;
  gap: 20px;
}
#stats-view.active { display: flex; }

.stats-heading {
  font-size: 0.68rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--text-2);
  font-weight: 600;
}

.stats-cards {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 10px;
}

.stat-card {
  background: var(--surface);
  border-radius: 14px;
  padding: 14px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.stat-card .num {
  font-size: 1.7rem;
  font-weight: 700;
  color: var(--text);
  line-height: 1;
}
.stat-card .lbl {
  font-size: 0.62rem;
  color: var(--text-2);
  text-align: center;
  letter-spacing: 0.04em;
  font-weight: 500;
}

.dist-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
}
.dist-row .guess-num {
  color: var(--text-2);
  font-weight: 600;
  width: 12px;
  text-align: center;
  flex-shrink: 0;
}
.dist-bar-wrap {
  flex: 1;
  height: 26px;
  background: var(--surface);
  border-radius: 6px;
  overflow: hidden;
}
.dist-bar {
  height: 100%;
  background: var(--gray);
  border-radius: 6px;
  display: flex;
  align-items: center;
  padding: 0 10px;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text);
  min-width: 28px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}
.dist-bar.highlight { background: var(--green); }

/* ── Bottom Nav ── */
#bottom-nav {
  width: 100%;
  max-width: 500px;
  height: 64px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  border-top: 1px solid var(--border-empty);
  background: var(--bg);
}

.nav-btn {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  background: none;
  border: none;
  color: var(--text-2);
  font-family: inherit;
  font-size: 0.6rem;
  font-weight: 600;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  cursor: pointer;
  padding: 8px 0;
  transition: color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.nav-btn svg { transition: stroke 0.15s; }
.nav-btn.active { color: var(--text); }
.nav-btn.active svg { stroke: var(--text); }

/* ── Confetti ── */
#confetti-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 49;
}

/* ── Responsive ── */
@media (max-width: 420px) {
  :root { --tile-size: 54px; --tile-gap: 6px; }
  .tile-front, .tile-back { font-size: 1.3rem; }
  .key { height: 48px; font-size: 0.74rem; }
  .key.wide { font-size: 0.62rem; max-width: 54px; }
  .stats-cards { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 360px) {
  :root { --tile-size: 47px; --tile-gap: 5px; }
  .key { height: 44px; min-width: 26px; }
}
</style>
</head>

        <line x1="3" y1="6"  x2="17" y2="6"/>
        <line x1="3" y1="10" x2="17" y2="10"/>
        <line x1="3" y1="14" x2="17" y2="14"/>
      </svg>
    </button>
  </div>
  <h1>WORDLY</h1>
  <div class="header-side right">
    <button class="icon-btn" id="btn-stats" aria-label="Statistics">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3"  y="11" width="4" height="6" rx="1"/>
        <rect x="8"  y="7"  width="4" height="10" rx="1"/>
        <rect x="13" y="3"  width="4" height="14" rx="1"/>
      </svg>
    </button>
    <button class="icon-btn" aria-label="Settings">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="10" cy="10" r="2.5"/>
        <path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.22 4.22l1.42 1.42M14.36 14.36l1.42 1.42M4.22 15.78l1.42-1.42M14.36 5.64l1.42-1.42"/>
      </svg>
    </button>
  </div>
</header>

<div id="toast"></div>
<canvas id="confetti-canvas"></canvas>

<!-- Game view -->
<div id="game-view" style="position:relative;">
  <div id="grid-container">
    <div id="grid"></div>
  </div>

  <div id="keyboard">
    <div class="kb-row" id="kb-row-0"></div>
    <div class="kb-row" id="kb-row-1"></div>
    <div class="kb-row" id="kb-row-2"></div>
  </div>

  <!-- Victory card -->
  <div id="victory-card">
    <div class="vc-top">
      <div class="vc-check">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="2,7 5.5,10.5 12,3.5"/>
        </svg>
      </div>
      <span class="vc-title">You got it!</span>
      <button class="vc-share">Share</button>
    </div>
    <p class="vc-word-line">The word was <strong id="vc-word"></strong></p>
    <div class="vc-divider"></div>
    <div class="vc-actions">
      <button class="vc-btn-secondary" id="vc-play-again">Play Again</button>
    </div>
  </div>

  <!-- Loss card -->
  <div id="loss-card">
    <span class="lc-label">The word was</span>
    <span class="lc-word" id="lc-word"></span>
    <span class="lc-msg">Better luck next time.</span>
    <button class="lc-btn" id="lc-play-again">Play Again</button>
  </div>
</div>

<!-- Stats view -->
<div id="stats-view">
  <span class="stats-heading">Statistics</span>
  <div class="stats-cards">
    <div class="stat-card"><span class="num" id="stat-played">0</span><span class="lbl">Played</span></div>
    <div class="stat-card"><span class="num" id="stat-win-pct">0%</span><span class="lbl">Win %</span></div>
    <div class="stat-card"><span class="num" id="stat-streak">0</span><span class="lbl">Streak</span></div>
    <div class="stat-card"><span class="num" id="stat-max-streak">0</span><span class="lbl">Best</span></div>
  </div>
  <span class="stats-heading">Guess Distribution</span>
  <div id="dist-chart"></div>
</div>

// ─────────────────────────────────────────────
// KEYBOARD LAYOUT
// ─────────────────────────────────────────────
const KB_ROWS = [
  ['Q','W','E','R','T','Y','U','I','O','P'],
  ['A','S','D','F','G','H','J','K','L'],
  ['ENTER','Z','X','C','V','B','N','M','⌫'],
];

// ─────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────
let answer       = '';
let currentRow   = 0;
let currentCol   = 0;
let currentGuess = [];
let gameOver     = false;
let tileEls      = [];   // tileEls[row][col]
let keyEls       = {};   // keyEls['A'] = button element
let letterStates = {};   // best known state per letter

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
function init() {
  answer       = ANSWERS[Math.floor(Math.random() * ANSWERS.length)];
  currentRow   = 0;
  currentCol   = 0;
  currentGuess = [];
  gameOver     = false;
  letterStates = {};

  buildGrid();
  buildKeyboard();
  hideEndScreen();
}

// ─────────────────────────────────────────────
// DOM BUILDERS
// ─────────────────────────────────────────────
function buildGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  tileEls = [];

  for (let r = 0; r < 6; r++) {
    const rowEls = [];
    for (let c = 0; c < 5; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.row = r;
      tile.dataset.col = c;

      const inner = document.createElement('div');
      inner.className = 'tile-inner';

      const front = document.createElement('div');
      front.className = 'tile-front';

      const back = document.createElement('div');
      back.className = 'tile-back';

      inner.append(front, back);
      tile.appendChild(inner);
      grid.appendChild(tile);
      rowEls.push(tile);
    }
    tileEls.push(rowEls);
  }
}

function buildKeyboard() {
  keyEls = {};
  KB_ROWS.forEach((rowKeys, i) => {
    const rowEl = document.getElementById(`kb-row-${i}`);
    rowEl.innerHTML = '';
    rowKeys.forEach(k => {
      const btn = document.createElement('button');
      btn.className = 'key' + (k === 'ENTER' || k === '⌫' ? ' wide' : '');
      btn.textContent = k;
      btn.dataset.key = k;
      btn.addEventListener('click', () => handleKey(k));
      rowEl.appendChild(btn);
      if (k !== 'ENTER' && k !== '⌫') keyEls[k] = btn;
    });
  });
}

// ─────────────────────────────────────────────
// INPUT HANDLING
// ─────────────────────────────────────────────
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.altKey || e.metaKey) return;
  if (e.key === 'Enter')     { handleKey('ENTER'); return; }
  if (e.key === 'Backspace') { handleKey('⌫'); return; }
  const letter = e.key.toUpperCase();
  if (/^[A-Z]$/.test(letter)) handleKey(letter);
});

function handleKey(key) {
  if (gameOver) return;

  if (key === '⌫') {
    deleteLetter();
  } else if (key === 'ENTER') {
    submitGuess();
  } else if (/^[A-Z]$/.test(key) && currentCol < 5) {
    addLetter(key);
  }
}

function addLetter(letter) {
  if (currentCol >= 5) return;
  currentGuess[currentCol] = letter;
  const tile = tileEls[currentRow][currentCol];
  tile.querySelector('.tile-front').textContent = letter;
  tile.classList.add('filled', 'pop');
  tile.addEventListener('animationend', () => tile.classList.remove('pop'), { once: true });
  currentCol++;
}

function deleteLetter() {
  if (currentCol <= 0) return;
  currentCol--;
  currentGuess[currentCol] = '';
  const tile = tileEls[currentRow][currentCol];
  tile.querySelector('.tile-front').textContent = '';
  tile.classList.remove('filled');
}

// ─────────────────────────────────────────────
// GAME LOGIC
// ─────────────────────────────────────────────

/**
 * Evaluate a guess against the answer.
 * Returns an array of 5 state strings: 'green' | 'yellow' | 'gray'
 * Uses a two-pass algorithm to handle duplicate letters correctly.
 */
function evaluateGuess(guess, answer) {
  const result   = Array(5).fill('gray');
  const answerArr = answer.split('');
  const guessArr  = guess.split('');
  const used      = Array(5).fill(false); // tracks answer positions already matched

  // Pass 1: mark greens
  for (let i = 0; i < 5; i++) {
    if (guessArr[i] === answerArr[i]) {
      result[i] = 'green';
      used[i]   = true;
    }
  }

  // Pass 2: mark yellows
  for (let i = 0; i < 5; i++) {
    if (result[i] === 'green') continue;
    for (let j = 0; j < 5; j++) {
      if (!used[j] && guessArr[i] === answerArr[j]) {
        result[i] = 'yellow';
        used[j]   = true;
        break;
      }
    }
  }

  return result;
}

function submitGuess() {
  if (currentCol < 5) {
    showToast('Not enough letters');
    return;
  }

  const guess = currentGuess.join('');

  if (!VALID_WORDS.has(guess)) {
    shakeRow(currentRow, () => clearRow(currentRow));
    showToast('Not a word');
    return;
  }

  const states = evaluateGuess(guess, answer);
  revealRow(currentRow, guess, states);
}

// ─────────────────────────────────────────────
// REVEAL ANIMATION
// ─────────────────────────────────────────────
function revealRow(row, guess, states) {
  const FLIP_DELAY  = 280; // ms between each tile flip
  const FLIP_TOTAL  = states.length * FLIP_DELAY;

  states.forEach((state, col) => {
    const tile = tileEls[row][col];
    const back = tile.querySelector('.tile-back');
    back.textContent = guess[col];
    back.className   = `tile-back ${state}`;

    setTimeout(() => {
      tile.classList.add('flipped');
    }, col * FLIP_DELAY);
  });

  setTimeout(() => {
    // Update keyboard colors
    states.forEach((state, col) => {
      const letter = guess[col];
      const prev   = letterStates[letter];
      // Priority: green > yellow > gray
      if (!prev || (state === 'green') || (state === 'yellow' && prev === 'gray')) {
        letterStates[letter] = state;
        if (keyEls[letter]) {
          keyEls[letter].className = `key ${state}`;
        }
      }
    });

    const won = states.every(s => s === 'green');
    if (won) {
      triggerWin(row);
      return;
    }

    currentRow++;
    currentCol   = 0;
    currentGuess = [];

    if (currentRow >= 6) {
      triggerLoss();
    }
  }, FLIP_TOTAL + 80);
}

// ─────────────────────────────────────────────
// WIN / LOSS
// ─────────────────────────────────────────────
const WIN_MESSAGES = [
  'Brilliant!', 'Magnificent!', 'Impressive!',
  'Splendid!',  'Great!',       'Phew!'
];

function triggerWin(row) {
  gameOver = true;

  // Staggered wave on winning row (Apple-style, not bouncy)
  tileEls[row].forEach((tile, i) => {
    setTimeout(() => tile.classList.add('wave'), i * 90);
  });

  setTimeout(launchConfetti, 250);

  setTimeout(() => showEndScreen(true), 1400);
}

function triggerLoss() {
  gameOver = true;
  setTimeout(() => showEndScreen(false), 500);
}

// ─────────────────────────────────────────────
// END CARDS
// ─────────────────────────────────────────────
function showEndScreen(won) {
  if (won) {
    document.getElementById('vc-word').textContent = answer;
    document.getElementById('victory-card').classList.add('show');
    recordWin(true);
  } else {
    document.getElementById('lc-word').textContent = answer;
    document.getElementById('loss-card').classList.add('show');
    recordWin(false);
  }
}

function hideEndCards() {
  document.getElementById('victory-card').classList.remove('show');
  document.getElementById('loss-card').classList.remove('show');
}

document.getElementById('vc-play-again').addEventListener('click', () => {
  stopConfetti();
  hideEndCards();
  init();
});
document.getElementById('lc-play-again').addEventListener('click', () => {
  hideEndCards();
  init();
});

// ─────────────────────────────────────────────
// TOAST
// ─────────────────────────────────────────────
let toastTimer = null;

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1600);
}

// ─────────────────────────────────────────────
// SHAKE
// ─────────────────────────────────────────────
function shakeRow(row, onDone) {
  const tiles = tileEls[row];
  tiles.forEach(t => {
    t.style.animation = 'none';
    void t.offsetWidth; // force reflow so restart works
    t.style.animation = 'shake 0.38s cubic-bezier(0.36, 0.07, 0.19, 0.97)';
  });
  setTimeout(() => {
    tiles.forEach(t => { t.style.animation = ''; });
    if (onDone) onDone();
  }, 400);
}

// Clear the current row's tiles and reset input state so the player can retype.
function clearRow(row) {
  tileEls[row].forEach(t => {
    t.querySelector('.tile-front').textContent = '';
    t.classList.remove('filled', 'pop');
  });
  currentCol   = 0;
  currentGuess = [];
}

// ─────────────────────────────────────────────
// CONFETTI
// ─────────────────────────────────────────────
const canvas   = document.getElementById('confetti-canvas');
const ctx      = canvas.getContext('2d');
let particles  = [];
let confettiRaf = null;

const CONFETTI_COLORS = [
  '#65C466', '#D9B43B', '#7EB8F7', '#F07070', '#A57CF5', '#F7D96A'
];

function launchConfetti() {
  canvas.width  = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = [];

  for (let i = 0; i < 140; i++) {
    particles.push({
      x:    Math.random() * canvas.width,
      y:    -10 - Math.random() * 200,
      w:    6 + Math.random() * 7,
      h:    10 + Math.random() * 8,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      vx:   (Math.random() - 0.5) * 3.5,
      vy:   2.5 + Math.random() * 3,
      rot:  Math.random() * Math.PI * 2,
      rotV: (Math.random() - 0.5) * 0.18,
      opacity: 1,
    });
  }

  if (confettiRaf) cancelAnimationFrame(confettiRaf);
  drawConfetti();
}

function drawConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let alive = false;

  particles.forEach(p => {
    p.x   += p.vx;
    p.y   += p.vy;
    p.rot += p.rotV;
    p.vy  += 0.06; // gravity
    if (p.y > canvas.height * 0.7) p.opacity -= 0.018;
    if (p.opacity > 0 && p.y < canvas.height + 20) alive = true;

    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot);
    ctx.globalAlpha = Math.max(0, p.opacity);
    ctx.fillStyle   = p.color;
    ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
    ctx.restore();
  });

  if (alive) {
    confettiRaf = requestAnimationFrame(drawConfetti);
  } else {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }
}

function stopConfetti() {
  if (confettiRaf) cancelAnimationFrame(confettiRaf);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  particles = [];
}

window.addEventListener('resize', () => {
  if (particles.length > 0) {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
  }
});

// ─────────────────────────────────────────────
// STATISTICS
// ─────────────────────────────────────────────
let stats = { played: 0, wins: 0, streak: 0, maxStreak: 0, dist: [0,0,0,0,0,0] };

function recordWin(won) {
  stats.played++;
  if (won) {
    stats.wins++;
    stats.streak++;
    stats.maxStreak = Math.max(stats.maxStreak, stats.streak);
    if (currentRow >= 0 && currentRow < 6) stats.dist[currentRow]++;
  } else {
    stats.streak = 0;
  }
  renderStats();
}

function renderStats() {
  document.getElementById('stat-played').textContent   = stats.played;
  document.getElementById('stat-win-pct').textContent  =
    stats.played ? Math.round(stats.wins / stats.played * 100) + '%' : '0%';
  document.getElementById('stat-streak').textContent   = stats.streak;
  document.getElementById('stat-max-streak').textContent = stats.maxStreak;

  const maxVal = Math.max(...stats.dist, 1);
  const chart  = document.getElementById('dist-chart');
  chart.innerHTML = '';
  stats.dist.forEach((count, i) => {
    const pct = Math.max(8, Math.round((count / maxVal) * 100));
    const isLast = stats.wins > 0 && i === (currentRow - 1);
    chart.innerHTML += `
      <div class="dist-row">
        <span class="guess-num">${i + 1}</span>
        <div class="dist-bar-wrap">
          <div class="dist-bar${isLast ? ' highlight' : ''}" style="width:${pct}%">${count}</div>
        </div>
      </div>`;
  });
}

// ─────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────
function switchView(view) {
  const gameView  = document.getElementById('game-view');
  const statsView = document.getElementById('stats-view');
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));

  if (view === 'stats') {
    gameView.style.display  = 'none';
    statsView.classList.add('active');
    document.getElementById('nav-stats').classList.add('active');
    renderStats();
  } else {
    gameView.style.display  = '';
    statsView.classList.remove('active');
    document.getElementById('nav-daily').classList.add('active');
  }
}

document.getElementById('nav-daily').addEventListener('click',   () => switchView('game'));
document.getElementById('nav-stats').addEventListener('click',   () => switchView('stats'));
document.getElementById('nav-archive').addEventListener('click', () => switchView('stats'));
document.getElementById('btn-stats').addEventListener('click',   () => switchView('stats'));

// ─────────────────────────────────────────────
// START
// ─────────────────────────────────────────────
renderStats();
init();
</script>
